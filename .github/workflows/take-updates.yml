# Brings the platform's updates into your copy, as a pull request.
#
# **You do not need a terminal for this, and that is the point.** If you
# arrived by pressing "Deploy to Cloudflare", your repository is a copy, not a
# GitHub fork, so there is no "Sync fork" button. This does that job from the
# browser.
#
# ## Installing it - once
#
# The Deploy button cannot copy workflow files into the repository it makes,
# so this file arrived at `update-workflow.yml` in the root instead of the
# place that runs it. To put it there:
#
#   1. Open `update-workflow.yml` and copy its contents.
#   2. **Add file -> Create new file.**
#   3. Name it exactly `.github/workflows/take-updates.yml`.
#   4. Paste, then **Commit changes**.
#
# Replacing an older, longer version of this file? Merge the pull request
# that brought this one first: this file runs `scripts/take-updates.ts`, and
# until that pull request is merged the script is not in your repository.
#
# ## Using it
#
# Actions -> "Take updates from the platform" -> Run workflow. It opens a pull
# request showing exactly what changed. Read it, then merge it; Cloudflare
# redeploys on the merge. It also runs itself on the first of each month. It
# opens a pull request; it never merges one.
#
# ## Why it is this short
#
# GitHub does not let a workflow write under `.github/workflows/`, so no
# update can ever replace this file - only you can, by hand. The work is done
# by `scripts/take-updates.ts`, an ordinary file that each update brings with
# it, so this file has almost nothing that could need changing. Which of your
# files an update leaves alone, and why, is written at the top of that script
# - not here, because here it could never be corrected.
#
# ## For whoever edits this file
#
# Every licensee pasted these exact bytes, and changing any of them - a
# comment included - tells every one of them to paste it again. Treat an edit
# here as asking all of them for a manual step. And three things are a
# promise between this file and the script, which copies running this file
# will rely on for as long as they exist: the path `scripts/take-updates.ts`,
# starting it as `node <path>` from the checkout, and the environment it gets
# (GH_TOKEN and TAKE_UPDATES_SCRIPT here, the GITHUB_* variables from the
# runner). Do not change them. And keep facts that can go stale out of this
# file: anything written here can only be corrected by everyone pasting again.

name: Take updates from the platform

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC on the first of the month. Nothing here is urgent enough to
    # interrupt a day, and a monthly pull request is one a person still reads.
    - cron: "0 3 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  take:
    # Never from the branch the update is pushed to. That branch holds the
    # platform's files before you have read them, and running from it would
    # run its unmerged copy of the script with write access to your repository.
    if: github.ref_name != 'platform-update'
    runs-on: ubuntu-latest
    steps:
      # ref: the branch as it is now, not the commit this run was created from.
      # A re-run keeps the original `github.sha`, so without it the re-run reads
      # the repository as it was before the last update was merged, and opens a
      # second pull request for an update already taken. Seen for real.
      #
      # fetch-depth: 0: the update is pushed with `--force-with-lease`, which
      # checks the branch against what this checkout knows of it. A shallow
      # checkout knows nothing of that branch, so the push is refused as "stale
      # info" and an open pull request can never be brought up to date.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Through `node`, so nothing depends on an executable bit surviving.
      - name: Take the platform's updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAKE_UPDATES_SCRIPT: scripts/take-updates.ts
        run: |
          if [ ! -f "$TAKE_UPDATES_SCRIPT" ]; then
            echo "::error::$TAKE_UPDATES_SCRIPT がまだありません。「Take updates from the platform」の Pull request をマージしてから、このファイルを貼ってください。もう貼ったあとなら、マージすればこのまま動きます。"
            echo "::error::$TAKE_UPDATES_SCRIPT is not here yet. Merge the \"Take updates from the platform\" pull request first, then paste this file. If you already pasted it, merging is enough."
            echo "その Pull request が無いときは、このファイルの History から前の版に戻して1回実行し、できた Pull request をマージしてから、もう一度貼ってください。"
            echo "If there is no such pull request, restore the previous version of this file from its History, run it once, merge the pull request it opens, then paste this file again."
            exit 1
          fi
          node "$TAKE_UPDATES_SCRIPT"
